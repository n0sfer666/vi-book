[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0sfer666/vi-book"

[package]
name = "v-ide"
description = "A terminal note-taking app with vim-style editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "v-ide"
path = "src/main.rs"

[dependencies]
v-ide-tui = { path = "crates/tui", default-features = false }

[features]
default = ["lua", "vault", "notebook", "highlight"]
lua = ["v-ide-tui/lua"]
vault = ["v-ide-tui/vault"]
notebook = ["v-ide-tui/notebook"]
highlight = ["v-ide-tui/highlight"]

[dev-dependencies]
v-ide-text = { path = "crates/text" }
v-ide-keys = { path = "crates/keys" }
v-ide-engine = { path = "crates/engine" }
v-ide-editor = { path = "crates/editor" }
v-ide-markdown = { path = "crates/markdown" }
v-ide-vault = { path = "crates/vault" }
v-ide-notebook = { path = "crates/notebook" }
v-ide-lua = { path = "crates/lua" }
v-ide-view = { path = "crates/view" }
v-ide-syntax = { path = "crates/syntax" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
crossterm = "0.28"
insta = "1.48.0"
