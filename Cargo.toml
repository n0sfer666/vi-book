[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0sfer666/vi-book"

[package]
name = "v-ide"
description = "A terminal note-taking app with vim-style editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "v_ide"

[[bin]]
name = "v-ide"
path = "src/main.rs"

[dependencies]
v-ide-text = { path = "crates/text" }
v-ide-keys = { path = "crates/keys" }
v-ide-engine = { path = "crates/engine" }
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter = "0.26.9"
unicode-width = "=0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
notify = "8.2.0"
arboard = "3.4.1"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
tree-sitter-highlight = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
crossterm = "0.28"
insta = "1.48.0"
