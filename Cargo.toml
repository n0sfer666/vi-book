[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0sfer666/vi-book"

[package]
name = "v-ide"
description = "A terminal note-taking app with vim-style editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "v_ide"

[[bin]]
name = "v-ide"
path = "src/main.rs"

[dependencies]
v-ide-text = { path = "crates/text" }
v-ide-keys = { path = "crates/keys" }
v-ide-engine = { path = "crates/engine" }
v-ide-markdown = { path = "crates/markdown" }
v-ide-vault = { path = "crates/vault" }
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4.1"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
crossterm = "0.28"
insta = "1.48.0"
