[package]
name = "vi-book"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A terminal note-taking app with vim-style editing"
repository = "https://github.com/n0sfer666/vi-book"

[lib]
name = "vi_book"

[[bin]]
name = "vi-book"
path = "src/main.rs"

[dependencies]
ropey = "1.6"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter = "0.26.9"
unicode-width = "=0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
notify = "8.2.0"
arboard = "3.4.1"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
tree-sitter-highlight = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23.2"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
crossterm = "0.28"
insta = "1.48.0"
