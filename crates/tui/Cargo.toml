[package]
name = "v-ide-tui"
description = "Terminal UI for v-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
v-ide-text = { path = "../text" }
v-ide-keys = { path = "../keys" }
v-ide-engine = { path = "../engine" }
v-ide-editor = { path = "../editor" }
v-ide-markdown = { path = "../markdown", default-features = false }
v-ide-vault = { path = "../vault", optional = true }
v-ide-notebook = { path = "../notebook", optional = true }
v-ide-lua = { path = "../lua", optional = true }
v-ide-view = { path = "../view" }
v-ide-syntax = { path = "../syntax", optional = true }
crossterm = "0.28"
arboard = "3.4.1"

[features]
default = ["lua", "vault", "notebook", "highlight"]
lua = ["dep:v-ide-lua"]
vault = ["dep:v-ide-vault"]
notebook = ["dep:v-ide-notebook"]
highlight = ["v-ide-markdown/highlight", "dep:v-ide-syntax"]
