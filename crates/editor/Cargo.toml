[package]
name = "v-ide-editor"
description = "Editor state for v-ide: documents, windows and the module host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
v-ide-text = { path = "../text" }
v-ide-engine = { path = "../engine" }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
