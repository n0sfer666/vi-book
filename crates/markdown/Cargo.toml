[package]
name = "v-ide-markdown"
description = "Markdown engine and read-mode rendering for v-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
v-ide-editor = { path = "../editor" }
v-ide-syntax = { path = "../syntax", optional = true }
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
tree-sitter = "0.26.9"
unicode-width = "=0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
tree-sitter-highlight = "0.26.9"

[features]
default = ["highlight"]
highlight = ["dep:v-ide-syntax"]
